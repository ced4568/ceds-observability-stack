global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "proxmox"
    static_configs:
      - targets:
          - "10.10.30.250:9221"

  - job_name: "k3s-control-plane"
    static_configs:
      - targets:
          - "10.10.30.72:9100"
          - "10.10.30.245:9100"
          - "10.10.30.128:9100"

  - job_name: "k3s-workers"
    static_configs:
      - targets:
          - "10.10.30.101:9100"
          - "10.10.30.102:9100"
          - "10.10.30.103:9100"
          - "10.10.30.104:9100"
          - "10.10.30.105:9100"
          - "10.10.30.106:9100"
          - "10.10.30.107:9100"
          - "10.10.30.108:9100"
          - "10.10.30.109:9100"

  - job_name: "homelab-services"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - "10.10.30.250:8006"
          - "10.10.30.143:80"
