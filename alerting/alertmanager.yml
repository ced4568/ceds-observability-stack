```yaml
global:
  resolve_timeout: 5m

route:
  receiver: "default-receiver"
  group_by:
    - alertname
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "default-receiver"
    webhook_configs:
      - url: "http://example-webhook.local/alerts"
        send_resolved: true